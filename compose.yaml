
services:
  agent-api:
    build:
      context: .
      dockerfile: Dockerfile

    env_file:
      - .env

    environment:
      POSTGRES_HOST: host.docker.internal
      POSTGRES_PORT: "5433"
      USE_LANGGRAPH_AGENT: "true"
      RAG_API_BASE_URL: "http://host.docker.internal:8000"

    ports:
      - "127.0.0.1:8003:8002"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    depends_on:
      - agent-api

    ports:
      - "127.0.0.1:5174:80"
